services:
  postgres:
    image: postgres:16-alpine
    container_name: rcd_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rcd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rcd}
      POSTGRES_DB: ${POSTGRES_DB:-rcd_corp}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rcd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rcd} -d ${POSTGRES_DB:-rcd_corp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: rcd_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Rcd!Passw0rd}"
      MSSQL_PID: "Developer"
    ports:
      - "${SQLSERVER_BIND:-127.0.0.1}:${SQLSERVER_PORT:-14330}:1433"
    volumes:
      - rcd_mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: rcd_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-rcd}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-rcd}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-rcd_corp}
    ports:
      - "${MONGO_BIND:-127.0.0.1}:${MONGO_PORT:-27017}:27017"
    volumes:
      - rcd_mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rcd_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-rcd}"]
    ports:
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - rcd_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-rcd}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: rcd_sqlserver_init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Rcd!Passw0rd}"
      POSTGRES_DB: ${POSTGRES_DB:-rcd_corp}
    entrypoint: /bin/bash
    command:
      - -c
      - >
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C
        -Q "IF NOT EXISTS (SELECT * FROM sys.databases WHERE name = '$$POSTGRES_DB') CREATE DATABASE [$$POSTGRES_DB]"
    restart: "no"

  generator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rcd_generator
    depends_on:
      postgres:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RCD_POSTGRES_URL: "postgresql+psycopg2://${POSTGRES_USER:-rcd}:${POSTGRES_PASSWORD:-rcd}@postgres:5432/${POSTGRES_DB:-rcd_corp}"
      RCD_SQLSERVER_URL: "mssql+pyodbc://sa:${MSSQL_SA_PASSWORD:-Rcd!Passw0rd}@sqlserver:1433/${POSTGRES_DB:-rcd_corp}?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
      RCD_MONGODB_URL: "mongodb://${MONGO_USER:-rcd}:${MONGO_PASSWORD:-rcd}@mongodb:27017/${MONGO_DB:-rcd_corp}?authSource=admin"
      RCD_REDIS_URL: "redis://:${REDIS_PASSWORD:-rcd}@redis:6379/0"
    volumes:
      - ./output:/app/output
    command: ["generate", "--profile", "${GEN_PROFILE:-demo}", "--seed", "${GEN_SEED:-42}", "--sink", "all"]
    profiles:
      - run

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rcd_api
    depends_on:
      postgres:
        condition: service_healthy
      generator:
        condition: service_completed_successfully
    environment:
      RCD_POSTGRES_URL: "postgresql+psycopg2://${POSTGRES_USER:-rcd}:${POSTGRES_PASSWORD:-rcd}@postgres:5432/${POSTGRES_DB:-rcd_corp}"
      RCD_API_KEY: "${API_KEY:-rcd-dev-key}"
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      # No curl in the final image (purged after the ODBC driver install in
      # the Dockerfile to keep it lean) — Python's already there.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - run

  streamer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rcd_streamer
    depends_on:
      generator:
        condition: service_completed_successfully
    environment:
      RCD_POSTGRES_URL: "postgresql+psycopg2://${POSTGRES_USER:-rcd}:${POSTGRES_PASSWORD:-rcd}@postgres:5432/${POSTGRES_DB:-rcd_corp}"
      RCD_SQLSERVER_URL: "mssql+pyodbc://sa:${MSSQL_SA_PASSWORD:-Rcd!Passw0rd}@sqlserver:1433/${POSTGRES_DB:-rcd_corp}?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
      RCD_MONGODB_URL: "mongodb://${MONGO_USER:-rcd}:${MONGO_PASSWORD:-rcd}@mongodb:27017/${MONGO_DB:-rcd_corp}?authSource=admin"
      RCD_REDIS_URL: "redis://:${REDIS_PASSWORD:-rcd}@redis:6379/0"
    volumes:
      - ./output:/app/output
    command:
      - "stream"
      - "--profile"
      - "${GEN_PROFILE:-demo}"
      - "--seed"
      - "${GEN_SEED:-42}"
      - "--sink"
      - "all"
      - "--rows-per-tick"
      - "${STREAM_ROWS_PER_TICK:-25}"
      - "--interval"
      - "${STREAM_INTERVAL:-300}"
    restart: unless-stopped
    profiles:
      - run

volumes:
  rcd_pgdata:
  rcd_mssqldata:
  rcd_mongodata:
  rcd_redisdata:
